<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#238fd8" />
  <title>One Way Ticket</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="screen">
    <header class="app-header">
      <h1>One Way Ticket</h1>
    </header>

    <section class="ticket" aria-label="One way transit ticket">
      <button class="qr-button" id="qrButton" type="button" aria-label="Ticket QR code">
        <span class="qr-frame">
          <span class="fake-qr" role="img" aria-label="QR-style ticket code"></span>
        </span>
      </button>

      <div class="divider" aria-hidden="true"></div>

      <section class="ticket-details">
        <h2>INTERSTATE</h2>
        <div class="zone-number">2</div>
        <div class="zone-label">ZONE RIDE</div>
        <div class="passenger-count">1 Adult</div>
      </section>

      <section class="expiry-section">
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-dot" id="progressDot"></div>
        </div>
        <p class="expiry-text">Expires in <strong id="countdown">59:58</strong></p>
        <a href="#" class="instructions-link" id="instructionsLink">View Onboard Validator Instructions</a>
      </section>
    </section>

    <section class="hidden-color-panel" id="colorPanel" hidden aria-label="QR frame color controls">
      <div class="panel-header">
        <strong>QR frame color</strong>
        <button id="closePanel" type="button" aria-label="Close color controls">×</button>
      </div>
      <input id="hueSlider" type="range" min="0" max="360" value="48" aria-label="QR frame hue" />
      <div class="panel-footer">
        <span class="color-preview" id="colorPreview" aria-hidden="true"></span>
        <output id="colorValue" for="hueSlider">hsl(48 100% 50%)</output>
        <button id="resetColor" type="button">Reset</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
