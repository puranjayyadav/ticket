<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#238fd8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>One Way Ticket</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="screen">
    <header class="app-header">
      <h1>One Way Ticket</h1>
    </header>

    <section class="ticket" aria-label="One way transit ticket">
      <button
        class="qr-block"
        id="qrColorButton"
        type="button"
        aria-haspopup="dialog"
        aria-controls="colorSheet"
        aria-expanded="false"
        aria-label="Change QR frame color"
      >
        <div class="qr-frame">
          <svg class="qr-art" viewBox="0 0 37 37" role="img" aria-label="Non-scannable QR-style pattern" shape-rendering="crispEdges">
            <rect class="quiet-zone" width="37" height="37" />

            <g class="finder finder--top-left" transform="translate(2 2)">
              <rect width="7" height="7" />
              <rect class="finder-hole" x="1" y="1" width="5" height="5" />
              <rect x="2" y="2" width="3" height="3" />
            </g>
            <g class="finder finder--top-right" transform="translate(28 2)">
              <rect width="7" height="7" />
              <rect class="finder-hole" x="1" y="1" width="5" height="5" />
              <rect x="2" y="2" width="3" height="3" />
            </g>
            <g class="finder finder--bottom-left" transform="translate(2 28)">
              <rect width="7" height="7" />
              <rect class="finder-hole" x="1" y="1" width="5" height="5" />
              <rect x="2" y="2" width="3" height="3" />
            </g>

 23h2v1h-2zM11 23h2v1h-2zM14 23h5v1h-5zM21 23h2v1h-2zM25 23h1v1h-1zM28 23h1v1h-1zM30 23h2v1h-2zM2 24h1v1h-1zM6 24h5v1h-5zM12 24h1v1h-1zM17 24h7v1h-7zM25 24h1v1h-1zM27 24h7v1h-7zM3 25h3v1h-3zM7 25h2v1h-2zM11 25h3v1h-3zM15 25h1v1h-1zM17 25h2v1h-2zM20 25h2v1h-2zM24 25h2v1h-2zM27 25h7v1h-7zM3 26h1v1h-1zM13 26h2v1h-2zM16 26h4v1h-4zM21 26h1v1h-1zM24 26h2v1h-2zM27 26h1v1h-1zM30 26h2v1h-2zM33 26h1v1h-1zM11 27h1v1h-1zM14 27h5v1h-5zM20 27h1v1h-1zM22 27h1v1h-1zM24 27h1v1h-1zM29 27h5v1h-5zM12 28h2v1h-2zM15 28h3v1h-3zM19 28h4v1h-4zM24 28h4v1h-4zM29 28h4v1h-4zM11 29h8v1h-8zM20 29h1v1h-1zM23 29h5v1h-5zM30 29h3v1h-3zM12 30h1v1h-1zM15 30h1v1h-1zM18 30h1v1h-1zM22 30h1v1h-1zM26 30h3v1h-3zM31 30h2v1h-2zM10 31h1v1h-1zM12 31h1v1h-1zM16 31h3v1h-3zM20 31h2v1h-2zM25 31h1v1h-1zM30 31h1v1h-1zM32 31h3v1h-3zM10 32h4v1h-4zM17 32h2v1h-2zM20 32h3v1h-3zM26 32h1v1h-1zM28 32h1v1h-1zM30 32h1v1h-1zM32 32h3v1h-3zM11 33h1v1h-1zM15 33h5v1h-5zM21 33h1v1h-1zM23 33h1v1h-1zM26 33h2v1h-2zM29 33h1v1h-1zM31 33h3v1h-3zM12 34h2v1h-2zM15 34h4v1h-4zM20 34h6v1h-6zM30 34h1v1h-1zM32 34h1v1h-1zM34 34h1v1h-1z" />
          </svg>
        </div>
      </button>

      <div class="divider" aria-hidden="true"></div>

      <section class="ticket-details">
        <h2>INTERSTATE</h2>
        <div class="zone-number">2</div>
        <div class="zone-label">ZONE RIDE</div>
        <div class="passenger-count">1 Adult</div>
      </section>

      <section class="expiry-section">
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-dot" id="progressDot"></div>
        </div>
        <p class="expiry-text">Expires in <strong id="countdown">59:58</strong></p>
        <a href="#" class="instructions-link" id="instructionsLink">View Onboard Validator Instructions</a>
      </section>
    </section>
  </main>

  <div class="sheet-backdrop" id="colorBackdrop" hidden></div>

  <section
    class="color-sheet"
    id="colorSheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="colorSheetTitle"
    hidden
  >
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <h2 id="colorSheetTitle">QR frame color</h2>
      <button class="sheet-close" id="closeColorSheet" type="button" aria-label="Close color controls">×</button>
    </div>

    <label class="hue-label" for="hueSlider">Choose color</label>
    <input id="hueSlider" type="range" min="0" max="360" value="48" />

    <div class="sheet-footer">
      <span class="color-preview" id="colorPreview" aria-hidden="true"></span>
      <output id="hueValue" for="hueSlider" aria-live="polite">48°</output>
      <button class="reset-color" id="resetColor" type="button">Reset</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
